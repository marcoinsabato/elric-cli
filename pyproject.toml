[project]
name = "elric-cli"
version = "1.0.0"
description = "CLI for bootstrapping and managing Elric projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Marco Insabato" },
]
keywords = ["elric", "cli", "framework", "fastapi", "boilerplate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Console",
]
urls = { Homepage = "https://github.com/marcoinsabato/elric-cli", Repository = "https://github.com/marcoinsabato/elric-cli", "Issue Tracker" = "https://github.com/marcoinsabato/elric-cli/issues" }
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.15.6",
]

[project.scripts]
elric = "elric_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elric_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"elric_cli/stubs/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
